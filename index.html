<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });

      // 매 접속마다 기준 색조(baseHue)를 무작위로 선택하고 30마리에 맞춰 색상이 절대 겹치지 않게 30분할
      var baseHue = Math.random();

      AFRAME.registerComponent("random-chair-color", {
        schema: {
          index: { type: "int", default: 0 },
        },
        init: function () {
          var el = this.el;
          var myIndex = this.data.index;

          // 색상환(360도)에서 12도(1/30)씩 정확히 등분하여 30마리 고슴도치 색상이 항상 다르고 뚜렷하게 대비되도록 설정
          var hue = (baseHue + myIndex / 30.0) % 1.0;
          var randomColor = new THREE.Color().setHSL(hue, 0.9, 0.55);

          el.addEventListener("model-loaded", function (e) {
            var model = e.detail.model || el.getObject3D("mesh");
            if (!model) return;

            model.traverse(function (node) {
              if (node.isMesh && node.material) {
                // 각 의자마다 독립적인 머티리얼 복제
                node.material = node.material.clone();
                node.material.color.copy(randomColor);
                node.material.needsUpdate = true;
              }
            });
          });
          el.addEventListener("model-error", function (e) {
            console.error("3D 모델 로드 실패:", e.detail);
          });
        },
      });

      // 실시간으로 색상이 계속 바뀌는 홀로그램 그라데이션 셰이더
      AFRAME.registerShader("hologram-sky", {
        schema: {
          time: { type: "time", is: "uniform" },
        },
        vertexShader: [
          "varying vec2 vUv;",
          "void main() {",
          "  vUv = uv;",
          "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
          "}",
        ].join("\n"),
        fragmentShader: [
          "precision mediump float;",
          "varying vec2 vUv;",
          "uniform float time;",
          "",
          "// 끊임없이 모든 네온 스펙트럼(시안, 블루, 바이올렛, 마젠타, 오렌지, 그린)을 순환하는 코사인 팔레트",
          "vec3 hologramPalette(float t) {",
          "  vec3 a = vec3(0.5, 0.5, 0.5);",
          "  vec3 b = vec3(0.5, 0.5, 0.5);",
          "  vec3 c = vec3(1.0, 1.0, 1.0);",
          "  vec3 d = vec3(0.00, 0.33, 0.67);",
          "  return a + b * cos(6.28318 * (c * t + d));",
          "}",
          "",
          "void main() {",
          "  // 왼쪽에서 오른쪽으로 (vUv.x * 1.8) 그라데이션 + 실시간으로 색상이 끊임없이 계속 바뀌도록 가속(time * 0.0009)",
          "  float t = vUv.x * 1.8 - time * 0.0009;",
          "  vec3 col = hologramPalette(t);",
          "",
          "  // 홀로그램 고유의 미세 수평 주사선(Scanline)",
          "  float scanline = 0.84 + 0.16 * sin(vUv.y * 650.0);",
          "",
          "  // 빛의 물결(홀로그램 파동 펄스) 추가",
          "  float wave = 0.06 * sin(vUv.x * 12.0 + time * 0.003);",
          "",
          "  // 색상 변화가 한눈에 잘 들어오면서도 우주 공간과 어울리는 깊이 있는 톤",
          "  vec3 finalColor = (col + wave) * scanline * 0.42;",
          "  gl_FragColor = vec4(finalColor, 1.0);",
          "}",
        ].join("\n"),
      });

      // 위에서 아래로 은은하고 투명하게 내리쬐는 빛줄기 제어 컴포넌트
      AFRAME.registerComponent("moving-lights", {
        init: function () {
          var el = this.el;
          // 투명한 빛에 어울리는 청아하고 맑은 파스텔/크리스탈 색상 팔레트
          var colors = [
            "#a5f3fc", // 맑은 크리스탈 시안
            "#e9d5ff", // 소프트 라벤더
            "#ffffff", // 퓨어 화이트
            "#c4b5fd", // 라이트 바이올렛
            "#fbcfe8", // 소프트 로즈
            "#a7f3d0", // 은은한 민트 에메랄드
            "#fef08a", // 샴페인 골드
            "#bae6fd"  // 스카이 블루
          ];
          var light = el.querySelector("[light]");
          var cone = el.querySelector("a-cone");
          var bulb = el.querySelector(".bulb");

          setInterval(function () {
            var c = colors[Math.floor(Math.random() * colors.length)];
            // 은은하고 부드러운 빛 강도
            var intensity = 2.2 + Math.random() * 2.0;
            // 뒤쪽 오브젝트가 깨끗하게 비치는 맑고 투명한 투명도 (0.06 ~ 0.13)
            var opacity = 0.06 + Math.random() * 0.07;

            if (light) {
              light.setAttribute("light", "color", c);
              light.setAttribute("light", "intensity", intensity);
            }
            if (cone) {
              cone.setAttribute("material", "color", c);
              cone.setAttribute("material", "opacity", opacity);
            }
            if (bulb) {
              bulb.setAttribute("material", "color", c);
              bulb.setAttribute("material", "emissive", c);
            }
          }, 400 + Math.random() * 300);
        },
      });

      // 선명하고 또렷하게 읽히는 네온 "★ 고슴도치 클럽 ★" 텍스처 컴포넌트
      AFRAME.registerComponent("neon-text-sign", {
        init: function () {
          var el = this.el;
          var canvas = document.createElement("canvas");
          canvas.width = 1024;
          canvas.height = 256;
          var ctx = canvas.getContext("2d");

          var texture = new THREE.CanvasTexture(canvas);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          // NormalBlending을 사용하여 텍스트가 하얗게 타지 않고 선명한 색감과 테두리가 또렷하게 유지됨
          var material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
          });

          var applyMaterial = function () {
            var mesh = el.getObject3D("mesh");
            if (mesh) {
              mesh.material = material;
            }
          };
          applyMaterial();
          el.addEventListener("object3dset", applyMaterial);

          var hue = 0;
          function render() {
            hue = (hue + 0.003) % 1.0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 쨍하고 비비드한 네온 컬러 (채도 100%, 명도 58%)
            var neonColor1 = new THREE.Color().setHSL(hue, 1.0, 0.58);
            var neonHex1 = "#" + neonColor1.getHexString();
            var neonColor2 = new THREE.Color().setHSL((hue + 0.18) % 1.0, 1.0, 0.62);
            var neonHex2 = "#" + neonColor2.getHexString();

            var text = "★ 고슴도치 클럽 ★";
            var x = canvas.width / 2;
            var y = canvas.height / 2;

            ctx.font = "900 86px 'Malgun Gothic', 'Apple SD Gothic Neo', 'Pretendard', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // 1단계: 어떤 밝은 배경에서도 글자가 또렷하게 읽히도록 두꺼운 다크 백드롭 아웃라인
            ctx.shadowBlur = 0;
            ctx.lineWidth = 22;
            ctx.strokeStyle = "rgba(3, 7, 18, 0.96)";
            ctx.lineJoin = "round";
            ctx.strokeText(text, x, y);

            // 2단계: 쨍하고 화려한 네온 컬러 외곽 글로우 (번짐)
            var pulse = Math.sin(Date.now() * 0.008);
            var blur = 24 + pulse * 10 + (Math.random() > 0.85 ? Math.random() * 12 : 0);
            ctx.shadowColor = neonHex1;
            ctx.shadowBlur = blur;
            ctx.lineWidth = 10;
            ctx.strokeStyle = neonHex1;
            ctx.strokeText(text, x, y);

            // 3단계: 글자 본체를 하얀색 대신 화려한 비비드 네온 그라데이션으로 꽉 채움
            var grad = ctx.createLinearGradient(x - 320, y, x + 320, y);
            grad.addColorStop(0, neonHex1);
            grad.addColorStop(0.5, "#ffffff"); // 중앙에만 얇게 반짝이는 빛줄기
            grad.addColorStop(1, neonHex2);

            ctx.shadowBlur = 10;
            ctx.shadowColor = neonHex1;
            ctx.fillStyle = grad;
            ctx.fillText(text, x, y);

            // 4단계: 선명한 얇은 림 라이트 (글자 획을 칼처럼 또렷하게 만듦)
            ctx.shadowBlur = 0;
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#ffffff";
            ctx.strokeText(text, x, y);

            texture.needsUpdate = true;
            requestAnimationFrame(render);
          }
          render();
        },
      });

      // 대왕 고슴도치 주변을 도는 황금빛 "👑 대왕고슴도치왕 👑" 텍스트 컴포넌트
      AFRAME.registerComponent("king-text-sign", {
        init: function () {
          var el = this.el;
          var canvas = document.createElement("canvas");
          canvas.width = 1024;
          canvas.height = 256;
          var ctx = canvas.getContext("2d");

          var texture = new THREE.CanvasTexture(canvas);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          var material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
          });

          var applyMaterial = function () {
            var mesh = el.getObject3D("mesh");
            if (mesh) {
              mesh.material = material;
            }
          };
          applyMaterial();
          el.addEventListener("object3dset", applyMaterial);

          function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            var pulse = Math.sin(Date.now() * 0.008);
            var goldHex = "#ffd700";
            var goldLightHex = "#fff59d";

            var text = "👑 대왕고슴도치왕 👑";
            var x = canvas.width / 2;
            var y = canvas.height / 2;

            ctx.font = "900 84px 'Malgun Gothic', 'Apple SD Gothic Neo', 'Pretendard', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // 1단계: 짙은 다크 아웃라인 (선명한 가독성 확보)
            ctx.shadowBlur = 0;
            ctx.lineWidth = 22;
            ctx.strokeStyle = "rgba(3, 7, 18, 0.96)";
            ctx.lineJoin = "round";
            ctx.strokeText(text, x, y);

            // 2단계: 황금빛 네온 외곽 글로우
            var blur = 24 + pulse * 10;
            ctx.shadowColor = goldHex;
            ctx.shadowBlur = blur;
            ctx.lineWidth = 10;
            ctx.strokeStyle = goldHex;
            ctx.strokeText(text, x, y);

            // 3단계: 찬란한 황금빛 그라데이션 채우기
            var grad = ctx.createLinearGradient(x - 300, y, x + 300, y);
            grad.addColorStop(0, goldHex);
            grad.addColorStop(0.5, "#ffffff"); // 중앙 다이아몬드 골드 하이라이트
            grad.addColorStop(1, goldLightHex);

            ctx.shadowBlur = 12;
            ctx.shadowColor = goldHex;
            ctx.fillStyle = grad;
            ctx.fillText(text, x, y);

            // 4단계: 날카로운 림 라이트 마감
            ctx.shadowBlur = 0;
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#ffffff";
            ctx.strokeText(text, x, y);

            texture.needsUpdate = true;
            requestAnimationFrame(render);
          }
          render();
        },
      });

      // 귀여운 작은 입체 5각별(★) 3D 지오메트리 생성 함수
      function createLittleStarGeometry() {
        var shape = new THREE.Shape();
        var points = 5;
        var outerRadius = 0.12; // 앙증맞고 작은 별 크기
        var innerRadius = 0.052;
        for (var i = 0; i < points * 2; i++) {
          var r = i % 2 === 0 ? outerRadius : innerRadius;
          var a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
          var x = Math.cos(a) * r;
          var y = Math.sin(a) * r;
          if (i === 0) shape.moveTo(x, y);
          else shape.lineTo(x, y);
        }
        shape.closePath();

        var extrudeSettings = {
          depth: 0.025,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.012,
          bevelThickness: 0.012,
        };
        var geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geo.center(); // 회전 축을 별 정중앙으로 정렬
        return geo;
      }

      // 공이 아니라 진짜 작은 입체 5각 별(★)들이 날아다니는 컴포넌트
      AFRAME.registerComponent("roaming-stars", {
        init: function () {
          var rig = this.el;
          var starGeo = createLittleStarGeometry();
          var starColors = [
            "#fffb00", // 샛노란 골드 별
            "#ffffff", // 영롱한 다이아몬드 화이트 별
            "#67e8f9", // 청아한 크리스탈 시안 별
            "#f472b6", // 사랑스러운 네온 핑크 별
            "#a7f3d0", // 맑은 에메랄드 별
            "#c084fc", // 신비로운 라벤더 별
          ];

          for (var i = 0; i < 20; i++) {
            var orbit = document.createElement("a-entity");

            // 360도 전 방향에 고르게 분산된 시작 각도
            var angle = i * 18 + (Math.random() * 6 - 3);
            var isReverse = i % 3 === 0;
            var toAngle = isReverse ? angle - 360 : angle + 360;

            var tiltX = -35 + Math.random() * 70;
            var tiltZ = -35 + Math.random() * 70;
            var dur = 3200 + Math.random() * 5200;

            orbit.setAttribute("rotation", tiltX + " " + angle + " " + tiltZ);
            orbit.setAttribute(
              "animation",
              "property: rotation; to: " +
                tiltX +
                " " +
                toAngle +
                " " +
                tiltZ +
                "; loop: true; dur: " +
                dur +
                "; easing: linear;"
            );

            // 공이 아니라 진짜 3D 입체 5각 별(★) 엔티티 생성
            var starEl = document.createElement("a-entity");
            var radius = 2.4 + (i % 6) * 0.85 + Math.random() * 0.4;
            var y = -1.1 + Math.random() * 2.2;
            var color = starColors[i % starColors.length];

            starEl.setAttribute("position", radius + " " + y + " 0");

            var starMesh = new THREE.Mesh(
              starGeo,
              new THREE.MeshBasicMaterial({
                color: new THREE.Color(color),
                side: THREE.DoubleSide,
              })
            );
            starEl.setObject3D("mesh", starMesh);

            // 별(★) 자체가 뾰족뾰족 빙글빙글 스스로 자전하는 스핀 애니메이션
            var spinDur = 1200 + Math.random() * 1500;
            starEl.setAttribute(
              "animation__spin",
              "property: rotation; to: 360 360 360; loop: true; dur: " +
                spinDur +
                "; easing: linear;"
            );

            // 반짝반짝 숨쉬듯 반짝이는 트윙클 애니메이션
            var twinkleDur = 450 + Math.random() * 600;
            starEl.setAttribute(
              "animation__twinkle",
              "property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: " +
                twinkleDur +
                "; easing: easeInOutSine;"
            );

            orbit.appendChild(starEl);
            rig.appendChild(orbit);
          }
        },
      });

      // 마우스 휠로 부드럽게 확대/축소(Zoom In / Zoom Out)하는 컴포넌트
      AFRAME.registerComponent("wheel-zoom", {
        schema: {
          minFov: { type: "number", default: 25 },
          maxFov: { type: "number", default: 110 },
          step: { type: "number", default: 4.5 },
        },
        init: function () {
          var el = this.el;
          var data = this.data;
          var targetFov = 80;
          var currentFov = 80;

          window.addEventListener(
            "wheel",
            function (e) {
              if (e.deltaY < 0) {
                targetFov = Math.max(data.minFov, targetFov - data.step);
              } else {
                targetFov = Math.min(data.maxFov, targetFov + data.step);
              }
            },
            { passive: true }
          );

          this.tick = function () {
            if (Math.abs(currentFov - targetFov) > 0.05) {
              currentFov += (targetFov - currentFov) * 0.16;
              var cam = el.getObject3D("camera");
              if (cam) {
                cam.fov = currentFov;
                cam.updateProjectionMatrix();
              }
              el.setAttribute("camera", "fov", currentFov);
            }
          };
        },
      });

      // 대왕고슴도치 일체형 플레이어 컨트롤러 (1인칭 시작 ⇄ 우클릭 시 3인칭 제3자 시점)
      AFRAME.registerComponent("king-hedgehog-controller", {
        init: function () {
          var playerRig = this.el;
          var cameraAnchor = document.querySelector("#camera-anchor");
          var cameraEl = document.querySelector("#player-camera");
          var keys = {};
          var isThirdPerson = false; // 기본 시작: 내가 대왕고슴도치가 된 1인칭 시점!

          // 키보드 입력 감지 (방향키 및 WASD, Space/Shift)
          window.addEventListener("keydown", function (e) {
            keys[e.code] = true;
          });
          window.addEventListener("keyup", function (e) {
            keys[e.code] = false;
          });

          // 시점 설정 함수
          function updateCameraView(animated) {
            if (isThirdPerson) {
              // 3인칭 (제3자 시점: 등 뒤 위쪽에서 대왕고슴도치를 내려다봄)
              if (animated) {
                cameraAnchor.setAttribute("animation__pos", {
                  property: "position",
                  to: "0 4.0 -7.2",
                  dur: 600,
                  easing: "easeOutCubic",
                });
                cameraAnchor.setAttribute("animation__rot", {
                  property: "rotation",
                  to: "-14 180 0",
                  dur: 600,
                  easing: "easeOutCubic",
                });
              } else {
                cameraAnchor.setAttribute("position", "0 4.0 -7.2");
                cameraAnchor.setAttribute("rotation", "-14 180 0");
              }
            } else {
              // 1인칭 (내가 대왕고슴도치가 된 시점! 고슴도치 이마/눈높이 위치)
              if (animated) {
                cameraAnchor.setAttribute("animation__pos", {
                  property: "position",
                  to: "0 1.2 2.3",
                  dur: 600,
                  easing: "easeOutCubic",
                });
                cameraAnchor.setAttribute("animation__rot", {
                  property: "rotation",
                  to: "0 0 0",
                  dur: 600,
                  easing: "easeOutCubic",
                });
              } else {
                cameraAnchor.setAttribute("position", "0 1.2 2.3");
                cameraAnchor.setAttribute("rotation", "0 0 0");
              }
            }
          }
          updateCameraView(false);

          // 마우스 우클릭 시: 1인칭 ⇄ 3인칭 제3자 시점 토글
          window.addEventListener("contextmenu", function (e) {
            e.preventDefault(); // 기본 우클릭 메뉴 차단
            isThirdPerson = !isThirdPerson;
            updateCameraView(true);
          });

          // 매 프레임 이동 및 시선 동기화
          this.tick = function (time, delta) {
            if (!delta) return;
            var dt = Math.min(delta / 1000, 0.1);
            var moveSpeed = 7.5;  // 비행/이동 속도
            var turnSpeed = 90.0; // 회전 속도

            var rot = playerRig.getAttribute("rotation") || { x: 0, y: 0, z: 0 };
            var pos = playerRig.getAttribute("position") || { x: 0, y: 6.2, z: 0 };

            // 1) 마우스 드래그 시선 동기화: 마우스로 돌린 각도를 대왕고슴도치 몸체에 반영
            var look = cameraEl.components["look-controls"];
            if (look && look.yawObject) {
              var deltaYaw = look.yawObject.rotation.y;
              if (Math.abs(deltaYaw) > 0.0001) {
                // 1인칭일 때는 마우스 수평 회전을 대왕고슴도치 몸체 회전으로 직접 전환
                if (!isThirdPerson) {
                  rot.y += THREE.MathUtils.radToDeg(deltaYaw);
                  look.yawObject.rotation.y = 0;
                }
              }
            }

            // 2) 키보드 방향키 회전 (←, →, A, D)
            if (keys["ArrowLeft"] || keys["KeyA"]) {
              rot.y += turnSpeed * dt;
            }
            if (keys["ArrowRight"] || keys["KeyD"]) {
              rot.y -= turnSpeed * dt;
            }

            // 3) 전진 / 후진 (↑, ↓, W, S) -> 대왕고슴도치가 바라보는 방향(+Z)으로 직진
            var rad = THREE.MathUtils.degToRad(rot.y);
            var fwdX = Math.sin(rad);
            var fwdZ = Math.cos(rad);
            var isMoving = false;

            if (keys["ArrowUp"] || keys["KeyW"]) {
              pos.x += fwdX * moveSpeed * dt;
              pos.z += fwdZ * moveSpeed * dt;
              isMoving = true;
            }
            if (keys["ArrowDown"] || keys["KeyS"]) {
              pos.x -= fwdX * moveSpeed * dt;
              pos.z -= fwdZ * moveSpeed * dt;
              isMoving = true;
            }

            // 4) 상승 / 하강 (Space, E / Shift, Q)
            if (keys["Space"] || keys["KeyE"]) {
              pos.y += moveSpeed * 0.75 * dt;
            }
            if (keys["ShiftLeft"] || keys["KeyQ"]) {
              pos.y = Math.max(0.6, pos.y - moveSpeed * 0.75 * dt);
            }

            // 5) 생동감 넘치는 비행 틸트 & 둥실둥실 모션
            if (isMoving) {
              rot.z = Math.sin(time * 0.01) * 3.5;
              rot.x = 2.5;
            } else {
              rot.z *= 0.88;
              rot.x = Math.sin(time * 0.002) * 1.8;
            }

            playerRig.setAttribute("rotation", rot);
            playerRig.setAttribute("position", pos);
          };
        },
      });

        if (window.location.protocol === "file:") {

          document.body.appendChild(notice);
        }
      });
    </script>
